<!-- @dsCard group="Patrones" name="KPIs" subtitle="Fila de stat tiles de la pestaña Cupo" -->
<!doctype html><html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="_card.css">
<style>
.tile { padding: 12px 16px; min-width: 128px; }
.tile b { display: block; font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
.tile span { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); }
</style></head><body>
<h1>KPIs</h1>
<div class="row">
  <div class="card tile"><b>12</b><span>usuarios</span></div>
  <div class="card tile"><b>27</b><span>películas sin ver</span></div>
  <div class="card tile"><b>3</b><span>usuarios sin saldo</span></div>
  <div class="card tile"><b>18</b><span>aprobadas (7 días)</span></div>
  <div class="card tile"><b>5</b><span>sin cupo (7 días)</span></div>
</div>
<p class="note">Número en tinta primaria — el color queda para los saldos de las tarjetas, donde es semántico.</p>
</body></html>
