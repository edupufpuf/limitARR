<!-- @dsCard group="Patrones" name="Navegación" subtitle="Sidebar con marca y pestaña activa" -->
<!doctype html><html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="_card.css">
<style>
.side { width: 240px; background: color-mix(in srgb, var(--bg-900) 80%, transparent); border: 1px solid color-mix(in srgb, var(--bg-700) 60%, transparent); border-radius: 12px; padding: 16px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 4px; margin-bottom: 24px; font-weight: 700; font-size: 18px; letter-spacing: -.02em; }
.mark { width: 32px; height: 32px; border-radius: 8px; background: linear-gradient(135deg, var(--accent-500), var(--accent-700)); box-shadow: var(--shadow-glow); display: flex; align-items: center; justify-content: center; }
.item { position: relative; display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 8px; font-size: 14px; font-weight: 500; color: var(--ink-2); margin-bottom: 4px; cursor: pointer; }
.item:hover { background: var(--bg-800); color: var(--ink); }
.item.active { background: rgba(220, 38, 38, .15); color: var(--accent-300); }
.item.active::before { content: ''; position: absolute; left: 0; top: 50%; transform: translateY(-50%); width: 3px; height: 20px; border-radius: 999px; background: var(--accent-500); }
.dot { width: 20px; height: 20px; border-radius: 5px; background: var(--bg-600); flex-shrink: 0; }
</style></head><body>
<h1>Sidebar</h1>
<div class="side">
  <div class="brand"><span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" style="width:18px;height:18px"><path stroke-linecap="round" d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18Z"/><path stroke-linecap="round" d="M12 12 15.5 8.5"/></svg></span><span>limit<span style="color:var(--accent-500)">ARR</span></span></div>
  <div class="item active"><span class="dot"></span>Cupo</div>
  <div class="item"><span class="dot"></span>Bibliotecas</div>
  <div class="item"><span class="dot"></span>Overrides</div>
  <div class="item"><span class="dot"></span>Registro</div>
  <div class="item"><span class="dot"></span>Avisos</div>
  <div class="item"><span class="dot"></span>Ajustes</div>
</div>
<p class="note">Activa: fondo rojo al 15% + barrita izquierda. Marca: cuadradito degradado con glow.</p>
</body></html>
